<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/css/style.css" rel="stylesheet" />
    <script
      src="https://kit.fontawesome.com/553a084866.js"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="/js/script.js"></script>
    <title>Feed</title>
  </head>
  <body
    class="bg-white dark:bg-gray-900 text-black dark:text-white min-h-screen grid grid-rows-[auto,1fr,auto]"
  >
    <header class="shadow-lg dark:bg-gray-700 min-h-14 flex">
      <nav class="container flex justify-between items-center mx-auto px-4">
        <div class="">
          <span class="text-lg font-bold text-gray-500 dark:text-gray-50"
            >My website</span
          >
        </div>
        <div class="hidden md:flex items-center space-x-4 gap-6">
          <div id="nav-links" class="flex items-center">
            <a
              class="py-4 px-2 text-gray-500 font-semibold hover:text-blue-700 dark:hover:text-blue-400 dark:text-gray-200 transition duration-300 flex items-center"
              href="/profile"
            >
              <img
                src="https://randomuser.me/api/portraits/men/32.jpg"
                alt="Profile picture"
                class="w-8 h-8 rounded-full mr-2"
              />
              Profile
            </a>
            <a
              class="py-4 px-2 text-gray-500 font-semibold hover:text-blue-700 dark:hover:text-blue-400 dark:text-gray-200 transition duration-300"
              href="/feed"
              >Feed</a
            >
            <a
              class="py-4 px-2 text-gray-500 font-semibold hover:text-blue-700 dark:hover:text-blue-400 dark:text-gray-200 transition duration-300"
              href="/"
              >Logout</a
            >
          </div>
          <button class="theme-toggler theme-toggle-button">
            <i class="fa-solid fa-moon fa-xl" style="color: #525252"></i>
          </button>
        </div>

        <div class="flex md:hidden z-40">
          <button id="burger-btn">
            <i class="fa-solid fa-bars fa-xl"></i>
          </button>
        </div>
        <div
          id="mobile-menu-wrapper"
          class="hidden justify-center flex-start absolute bg-blue-800 dark:bg-gray-700 right-0 top-0 w-full h-screen z-30"
        >
          <div
            id="mobile-menu"
            class="flex md:hidden flex-col items-center space-x-1 mt-20"
          >
            <a
              class="py-4 px-2 text-gray-200 font-semibold hover:text-blue-700 dark:text-gray-200"
              href="/profile"
              >Profile</a
            >
            <a
              class="py-4 px-2 text-gray-200 font-semibold hover:text-blue-700 dark:text-gray-200"
              href="/feed"
              >Feed</a
            >

            <a
              class="py-4 px-2 text-gray-200 font-semibold hover:text-blue-700 dark:text-gray-200"
              href="/"
              >Logout</a
            >
            <button class="theme-toggler theme-toggle-button mt-6">
              <i class="fa-solid fa-moon fa-xl" style="color: #dddddd"></i>
            </button>
          </div>
        </div>
      </nav>
    </header>
    <main class="container mx-auto">
      <section class="max-w-xl mx-auto py-8 px-4">
        <!-- Search Bar -->
        <form class="flex items-center mb-4" id="search-form">
          <input
            type="text"
            id="search-input"
            class="flex-1 px-4 py-2 rounded-l-md border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-100 focus:outline-none"
            placeholder="Search posts..."
            aria-label="Search posts"
          />
          <button
            type="submit"
            class="px-4 py-2 bg-blue-600 text-white rounded-r-md hover:bg-blue-700 transition"
            aria-label="Search"
          >
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </form>

        <!-- Sort Options -->
        <div class="flex items-center mb-6 space-x-2">
          <label
            for="sort-select"
            class="font-medium text-gray-700 dark:text-gray-200"
            >Sort by:</label
          >
          <select
            id="sort-select"
            class="px-3 py-2 rounded-md border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-100 focus:outline-none"
          >
            <option value="latest">Latest</option>
            <option value="oldest">Oldest</option>
            <option value="username">Username</option>
          </select>
        </div>

        <!-- Show Form Button -->
        <div class="mb-4">
          <button
            id="show-post-form-btn"
            type="button"
            class="w-full py-2 bg-green-600 text-white rounded-md font-semibold hover:bg-green-700 transition"
          >
            Create a New Post
          </button>
        </div>

        <!-- New Post Form (hidden by default) -->
        <form
          id="new-post-form"
          class="bg-gray-100 dark:bg-gray-800 rounded-lg shadow-md p-6 mb-8 hidden"
        >
          <h2
            class="text-lg font-semibold mb-4 text-gray-800 dark:text-gray-100"
          >
            Create a New Post
          </h2>
          <div class="mb-4">
            <label
              for="username"
              class="block mb-1 font-medium text-gray-700 dark:text-gray-200"
              >Username</label
            >
            <input
              type="text"
              id="username"
              name="username"
              required
              class="w-full px-3 py-2 rounded-md border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-100 focus:outline-none"
            />
          </div>
          <div class="mb-4">
            <label
              for="image-url"
              class="block mb-1 font-medium text-gray-700 dark:text-gray-200"
              >Image URL</label
            >
            <input
              type="url"
              id="image-url"
              name="image-url"
              required
              class="w-full px-3 py-2 rounded-md border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-100 focus:outline-none"
            />
          </div>
          <div class="mb-4">
            <label
              for="post-content"
              class="block mb-1 font-medium text-gray-700 dark:text-gray-200"
              >Post Content</label
            >
            <textarea
              id="post-content"
              name="post-content"
              rows="3"
              required
              class="w-full px-3 py-2 rounded-md border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-100 focus:outline-none"
            ></textarea>
          </div>
          <button
            type="submit"
            class="w-full py-2 bg-blue-600 text-white rounded-md font-semibold hover:bg-blue-700 transition"
          >
            Post
          </button>
        </form>
      </section>
      <section id="posts-container" class="space-y-8 py-8"></section>
    </main>
    <footer>
      <div class="text-center py-4 bg-gray-200 dark:bg-gray-800">
        <p class="text-sm text-gray-600 dark:text-gray-400">
          &copy; 2023 My Website. All rights reserved.
        </p>
      </div>
    </footer>
  </body>
</html>
