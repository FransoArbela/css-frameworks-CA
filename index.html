<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="css/style.css" rel="stylesheet" />
    <script
      src="https://kit.fontawesome.com/553a084866.js"
      crossorigin="anonymous"
    ></script>
    <script src="/js/script.js" defer></script>
    <title>Authentication</title>
  </head>
  <body class="bg-white dark:bg-gray-900 text-black dark:text-white min-h-screen grid grid-rows-[auto,1fr,auto]">
    <header class="shadow-lg dark:bg-gray-700 min-h-14 flex">
      <nav class="container flex justify-between items-center mx-auto px-4">
        <div class="">
          <span class="text-lg font-bold text-gray-500 dark:text-gray-50"
            >My website</span
          >
        </div>
        <div class="hidden md:flex items-center space-x-4 gap-6">
          <div id="nav-links" class="flex">
            <a
              class="py-4 px-2 text-gray-500 font-semibold hover:text-blue-700 dark:hover:text-blue-400 dark:text-gray-200 transition duration-300"
              href="/profile"
              >Login</a
            >
          </div>
          <button id="theme-toggler" class="theme-toggle-button">
            <i class="fa-solid fa-moon fa-xl" style="color: #525252"></i>
          </button>
        </div>

        <div class="flex md:hidden z-40">
          <button id="burger-btn">
            <i class="fa-solid fa-bars fa-xl"></i>
          </button>
        </div>
        <div
          id="mobile-menu-wrapper"
          class="hidden justify-center flex-start absolute bg-blue-800 dark:bg-gray-700 right-0 top-0 w-full h-screen z-30"
        >
          <div
            id="mobile-menu"
            class="flex md:hidden flex-col items-center space-x-1 mt-20"
          >
            <a
              class="py-4 px-2 text-gray-200 font-semibold hover:text-blue-700 dark:text-gray-200"
              href="/profile"
              >Login</a
            >

            <button id="theme-toggler" class="theme-toggle-button mt-6">
              <i class="fa-solid fa-moon fa-xl" style="color: #dddddd"></i>
            </button>
          </div>
        </div>
      </nav>
    </header>
    <main class="container mx-auto my-7">
      <div class="w-80 mx-auto mt-16 px-4 py-8">
        <h1 class="text-2xl font-bold mb-4">Welcome to the Authentication Page</h1>
        <p class="mb-6">Please log in to access your profile and feed.</p>
        <form action="/profile" class="space-y-4">
          <div>
            <label for="email" class="block text-sm font-medium mb-2">Email</label>
            <input
              type="text"
              id="email"
              name="email"
              required
              class="w-full p-2 border border-gray-300 rounded"
              placeholder="Enter your email"
            />
          </div>
          <div>
            <label for="password" class="block text-sm font-medium mb-2">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              required
              class="w-full p-2 border border-gray-300 rounded"
              placeholder="Enter your password"
              minlength="8"
            />
          </div>
          <button
            type="submit"
            class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition duration-300"
          >
            Login
          </button>
        </form>
      </div>
    </main>
    <footer>
      <div class="text-center py-4 bg-gray-200 dark:bg-gray-800">
        <p class="text-sm text-gray-600 dark:text-gray-400">
          &copy; 2023 My Website. All rights reserved.
        </p>
      </div>
    </footer>
  </body>
</html>
