<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/style.css" />
    <script
      src="https://kit.fontawesome.com/553a084866.js"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="/js/script.js"></script>
    <title>Profile</title>
  </head>
  <body class="bg-white dark:bg-gray-900 text-black dark:text-white min-h-screen grid grid-rows-[auto,1fr,auto]">
        <header class="shadow-lg dark:bg-gray-700 min-h-14 flex">
      <nav class="container flex justify-between items-center mx-auto px-4">
        <div class="">
          <span class="text-lg font-bold text-gray-500 dark:text-gray-50"
            >My website</span
          >
        </div>
        <div class="hidden md:flex items-center space-x-4 gap-6">
            <div id="nav-links" class="flex items-center">
            <a
              class="py-4 px-2 text-gray-500 font-semibold hover:text-blue-700 dark:hover:text-blue-400 dark:text-gray-200 transition duration-300 flex items-center"
              href="/profile"
            >
            <img
            src="https://randomuser.me/api/portraits/men/32.jpg"
            alt="Profile picture"
            class="w-8 h-8 rounded-full mr-2"
            />
              Profile
            </a>
            <a
              class="py-4 px-2 text-gray-500 font-semibold hover:text-blue-700 dark:hover:text-blue-400 dark:text-gray-200 transition duration-300"
              href="/feed"
              >Feed</a
            >
            <a
              class="py-4 px-2 text-gray-500 font-semibold hover:text-blue-700 dark:hover:text-blue-400 dark:text-gray-200 transition duration-300"
              href="/"
              >Logout</a
            >
            </div>
          <button class="theme-toggler theme-toggle-button">
            <i class="fa-solid fa-moon fa-xl" style="color: #525252"></i>
          </button>
        </div>

        <div class="flex md:hidden z-40">
          <button id="burger-btn">
            <i class="fa-solid fa-bars fa-xl"></i>
          </button>
        </div>
        <div
          id="mobile-menu-wrapper"
          class="hidden justify-center flex-start absolute bg-blue-800 dark:bg-gray-700 right-0 top-0 w-full h-screen z-30"
        >
          <div
            id="mobile-menu"
            class="flex md:hidden flex-col items-center space-x-1 mt-20"
          >
            <a
              class="py-4 px-2 text-gray-200 font-semibold hover:text-blue-700 dark:text-gray-200"
              href="/profile"
              >Profile</a
            >
            <a
              class="py-4 px-2 text-gray-200 font-semibold hover:text-blue-700 dark:text-gray-200"
              href="/feed"
              >Feed</a
            >

            <a
              class="py-4 px-2 text-gray-200 font-semibold hover:text-blue-700 dark:text-gray-200"
              href="/"
              >Logout</a
            >
            <button class="theme-toggler theme-toggle-button mt-6">
              <i class="fa-solid fa-moon fa-xl" style="color: #dddddd"></i>
            </button>
          </div>
        </div>
      </nav>
    </header>
    <main class="container mx-auto">
      <section
        class="flex flex-col items-center gap-8 py-10 1xs:w-"
      >
        <!-- Profile Image and Info -->
        <div class="flex flex-col items-center  w-full md:w-1/3">
          <img
        src="https://randomuser.me/api/portraits/men/32.jpg"
        alt="Profile Image"
        class="w-32 h-32 rounded-full border-4 border-blue-500 shadow-lg mb-4"
          />
          <h2 class="text-2xl font-bold mb-2">john_doe</h2>
          <button
        class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded transition mb-4"
          >
        Follow
          </button>
          <div class="flex gap-6 text-center">
        <div>
          <span class="block text-lg font-bold">120</span>
          <span class="text-gray-500 dark:text-gray-300">Followers</span>
        </div>
        <div>
          <span class="block text-lg font-bold">180</span>
          <span class="text-gray-500 dark:text-gray-300">Following</span>
        </div>
          </div>
        </div>
        <!-- User Posts Grid -->
        <div class="w-full md:w-2/3">
          <h3 class="text-xl font-semibold mb-4 px-4">Posts</h3>
          <div class="grid md:grid-cols-3 xs:grid-cols-2 1xs:grid-cols-1 gap-4">
        <div class="overflow-hidden py-4 px-4">
          <img
            src="https://images.unsplash.com/photo-1747985323857-5c1c16b2ac47?q=80&w=1150&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            alt="Post 1"
            class="w-full h-40 object-cover rounded transition-transform duration-300 ease-in-out hover:scale-110"
          />
        </div>
        <div class="overflow-hidden  py-4 px-4">
          <img
            src="https://images.unsplash.com/photo-1746768934174-dda0f666ac41?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            alt="Post 2"
            class="w-full h-40 object-cover rounded transition-transform duration-300 ease-in-out hover:scale-110"
          />
        </div>
        <div class="overflow-hidden  py-4 px-4">
          <img
            src="https://images.unsplash.com/photo-1748306295424-de2d800de85d?q=80&w=987&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            alt="Post 3"
            class="w-full h-40 object-cover rounded transition-transform duration-300 ease-in-out hover:scale-110"
          />
        </div>
        <div class="overflow-hidden  py-4 px-4">
          <img
            src="https://images.unsplash.com/photo-1747506071666-56f764a7de6f?q=80&w=987&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            alt="Post 4"
            class="w-full h-40 object-cover rounded transition-transform duration-300 ease-in-out hover:scale-110"
          />
        </div>
        <div class="overflow-hidden  py-4 px-4">
          <img
            src="https://images.unsplash.com/photo-1747903239211-ea42ad341368?q=80&w=987&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            alt="Post 5"
            class="w-full h-40 object-cover rounded transition-transform duration-300 ease-in-out hover:scale-110"
          />
        </div>
        <div class="overflow-hidden  py-4 px-4">
          <img
            src="https://images.unsplash.com/photo-1746980776869-0443aaffc7f2?q=80&w=987&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            alt="Post 6"
            class="w-full h-40 object-cover rounded transition-transform duration-300 ease-in-out hover:scale-110"
          />
        </div>
          </div>
        </div>
      </section>
    </main>
        <footer>
      <div class="text-center py-4 bg-gray-200 dark:bg-gray-800">
        <p class="text-sm text-gray-600 dark:text-gray-400">
          &copy; 2023 My Website. All rights reserved.
        </p>
      </div>
    </footer>
  </body>
</html>
